<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <title>اختبار PDF</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            direction: rtl;
            text-align: right;
            padding: 20px;
        }
        h1 {
            color: #2c5530;
            text-align: center;
        }
        .arabic-text {
            font-size: 14px;
            line-height: 1.6;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: #428bca;
            color: white;
        }
    </style>
</head>
<body>
    <h1>تقرير تجريبي لاختبار PDF</h1>
    <div class="arabic-text">
        <p>هذا نص تجريبي باللغة العربية لاختبار إنشاء ملف PDF باستخدام Chrome Headless.</p>
        <p>يجب أن يظهر النص العربي بشكل صحيح مع اتجاه الكتابة من اليمين إلى اليسار.</p>
    </div>

    <table>
        <thead>
            <tr>
                <th>المعرف</th>
                <th>اسم العميل</th>
                <th>رقم الهاتف</th>
                <th>الحالة</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>أحمد محمد علي</td>
                <td>01234567890</td>
                <td>نشط</td>
            </tr>
            <tr>
                <td>2</td>
                <td>فاطمة سعد الدين</td>
                <td>01987654321</td>
                <td>معلق</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
