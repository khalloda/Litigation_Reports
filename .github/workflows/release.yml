name: Release Management

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        default: 'patch'
        type: choice
        options:
        - patch
        - minor
        - major
      release_notes:
        description: 'Release notes (markdown supported)'
        required: false

jobs:
  validate-release:
    name: Validate Release
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run full test suite
      run: |
        npm run lint
        npm run type-check
        npm run test
        npm run build

    - name: Validate version format
      if: github.event_name == 'push'
      run: |
        TAG=${GITHUB_REF#refs/tags/}
        if [[ ! $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "❌ Invalid version format: $TAG"
          echo "Expected format: v1.2.3"
          exit 1
        fi
        echo "✅ Valid version format: $TAG"

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: validate-release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Generate release notes
      run: |
        TAG=${GITHUB_REF#refs/tags/}

        # Get previous tag
        PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

        echo "# Release $TAG" > release_notes.md
        echo "" >> release_notes.md

        if [ -n "$PREV_TAG" ]; then
          echo "## Changes since $PREV_TAG" >> release_notes.md
          echo "" >> release_notes.md

          # Get commits since last tag
          git log $PREV_TAG..HEAD --pretty=format:"- %s (%h)" --no-merges >> release_notes.md
        else
          echo "## Changes in this release" >> release_notes.md
          echo "" >> release_notes.md
          echo "- Initial release" >> release_notes.md
        fi

        echo "" >> release_notes.md
        echo "## Deployment" >> release_notes.md
        echo "" >> release_notes.md
        echo "This release is ready for deployment to production." >> release_notes.md
        echo "" >> release_notes.md
        echo "### Manual Deployment Steps" >> release_notes.md
        echo "1. Download the production deployment artifact from the deploy-production workflow" >> release_notes.md
        echo "2. Follow the deployment guide in \`docs/deployment/guide.md\`" >> release_notes.md
        echo "3. Verify all security checklist items" >> release_notes.md
        echo "" >> release_notes.md
        echo "**Production URL**: https://lit.sarieldin.com" >> release_notes.md

    - name: Create Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref_name }}
        release_name: Release ${{ github.ref_name }}
        body_path: release_notes.md
        draft: false
        prerelease: false

  version-bump:
    name: Version Bump (Manual Trigger)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Configure git
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

    - name: Version bump
      run: |
        # Bump version based on input
        npm version ${{ github.event.inputs.release_type }} --no-git-tag-version

        # Get new version
        NEW_VERSION=$(node -p "require('./package.json').version")
        echo "NEW_VERSION=v$NEW_VERSION" >> $GITHUB_ENV

        # Commit version bump
        git add package.json
        git commit -m "chore: bump version to v$NEW_VERSION"

        # Create and push tag
        git tag "v$NEW_VERSION"
        git push origin HEAD --tags

    - name: Create release notes from input
      if: github.event.inputs.release_notes != ''
      run: |
        echo "${{ github.event.inputs.release_notes }}" > manual_release_notes.md

    - name: Create manual release
      if: github.event.inputs.release_notes != ''
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ env.NEW_VERSION }}
        release_name: Release ${{ env.NEW_VERSION }}
        body_path: manual_release_notes.md
        draft: false
        prerelease: false

  notify-deployment:
    name: Trigger Deployment
    runs-on: ubuntu-latest
    needs: [create-release]
    if: always() && needs.create-release.result == 'success'

    steps:
    - name: Trigger production deployment
      run: |
        echo "🚀 Release created successfully"
        echo "📦 Version: ${{ github.ref_name }}"
        echo ""
        echo "The production deployment workflow will be triggered automatically."
        echo "Monitor the deployment at: ${{ github.server_url }}/${{ github.repository }}/actions"