name: Bug Report
description: Report a bug to help us improve the system
title: "[BUG] "
labels: ["bug", "needs-triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please fill out this form to help us understand and fix the issue.

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission Checklist
      description: Please verify the following before submitting
      options:
        - label: I have searched existing issues to ensure this isn't a duplicate
          required: true
        - label: I have tested this on the latest version
          required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: Where did this bug occur?
      options:
        - Production (lit.sarieldin.com)
        - Staging
        - Local Development
        - Testing Environment
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of the system is affected?
      options:
        - Frontend (React UI)
        - Backend API (PHP)
        - Database
        - Authentication
        - Reports
        - Cases Management
        - Clients Management
        - Hearings Management
        - File Uploads
        - Other
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser/Device
      description: "Browser and version (e.g., Chrome 120, Safari 17, Mobile iOS)"
      placeholder: "Chrome 120.0.0.0"
    validations:
      required: false

  - type: textarea
    id: summary
    attributes:
      label: Bug Summary
      description: Brief description of the issue
      placeholder: "Describe the bug in 1-2 sentences"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the bug
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Fill in '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen instead?
      placeholder: "Describe what you expected to happen"
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
      placeholder: "Describe what actually happened"
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots/Videos
      description: If applicable, add screenshots or videos to help explain the problem
      placeholder: "Drag and drop images here or paste links"

  - type: textarea
    id: console
    attributes:
      label: Browser Console Errors
      description: Any error messages in the browser console (F12 → Console)
      placeholder: "Paste any error messages here"
      render: text

  - type: textarea
    id: network
    attributes:
      label: Network Errors
      description: Any failed API requests (F12 → Network → filter by failed requests)
      placeholder: "List any failed API calls and their error codes"

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How severe is this bug?
      options:
        - Critical (System unusable, blocks core functionality)
        - High (Major feature broken, significant impact)
        - Medium (Feature partially broken, workaround exists)
        - Low (Minor issue, cosmetic problem)
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: Frequency
      description: How often does this happen?
      options:
        - Always (100% of the time)
        - Often (75% of the time)
        - Sometimes (50% of the time)
        - Rarely (25% of the time)
        - Once (happened only once)
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: Workaround
      description: Is there a temporary workaround for this issue?
      placeholder: "Describe any workaround if one exists"

  - type: textarea
    id: additional
    attributes:
      label: Additional Information
      description: Any other relevant information
      placeholder: "Add any other context about the problem here"