name: Continuous Integration

on:
  push:
    branches: [ main, develop, 'fix/*', 'feature/*' ]
  pull_request:
    branches: [ main, develop ]

env:
  NODE_VERSION: '18'
  PHP_VERSION: '8.2'

jobs:
  # Frontend Testing
  frontend-tests:
    name: Frontend Tests (React/TypeScript)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Type checking
      run: npm run type-check

    - name: Lint code
      run: npm run lint

    - name: Format check
      run: npm run format:check

    - name: Run unit tests
      run: npm run test -- --coverage

    - name: Build application
      run: npm run build

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      if: always()
      with:
        file: ./coverage/lcov.info
        flags: frontend

  # Backend Testing
  backend-tests:
    name: Backend Tests (PHP)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_password
          MYSQL_DATABASE: litigation_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ env.PHP_VERSION }}
        extensions: pdo, pdo_mysql, json, curl
        coverage: xdebug

    - name: Verify MySQL connection
      run: |
        mysql --host 127.0.0.1 --port 3306 -uroot -ptest_password -e "SHOW DATABASES"

    - name: Set up test environment
      run: |
        cp .env.example .env.test
        sed -i 's/DB_HOST=localhost/DB_HOST=127.0.0.1/' .env.test
        sed -i 's/DB_NAME=litigation_db/DB_NAME=litigation_test/' .env.test
        sed -i 's/DB_PASS=your_password_here/DB_PASS=test_password/' .env.test

    - name: Run database migrations
      run: |
        if [ -f "database/migrations/init.sql" ]; then
          mysql --host 127.0.0.1 --port 3306 -uroot -ptest_password litigation_test < database/migrations/init.sql
        fi

    - name: Test API endpoints
      run: |
        if [ -d "tests/api" ]; then
          echo "Running organized API tests"
          find tests/api -name "*.php" -type f | head -5
        else
          echo "API tests directory not found, skipping"
        fi

    - name: Test database connections
      run: |
        if [ -f "tests/api/database/test-mysql-connection.php" ]; then
          php tests/api/database/test-mysql-connection.php
        else
          echo "Database connection test not found, skipping"
        fi

  # E2E Testing
  e2e-tests:
    name: End-to-End Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [frontend-tests, backend-tests]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_password
          MYSQL_DATABASE: litigation_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ env.PHP_VERSION }}
        extensions: pdo, pdo_mysql, json, curl

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright browsers
      run: npx playwright install --with-deps

    - name: Set up test environment
      run: |
        cp .env.example .env.test
        sed -i 's/DB_HOST=localhost/DB_HOST=127.0.0.1/' .env.test
        sed -i 's/DB_NAME=litigation_db/DB_NAME=litigation_test/' .env.test
        sed -i 's/DB_PASS=your_password_here/DB_PASS=test_password/' .env.test

    - name: Build application
      run: npm run build

    - name: Start test servers
      run: |
        # Start PHP backend
        php -S localhost:8000 -t public &
        BACKEND_PID=$!
        echo "Backend PID: $BACKEND_PID"

        # Start frontend server
        npm run preview &
        FRONTEND_PID=$!
        echo "Frontend PID: $FRONTEND_PID"

        # Wait for servers to start
        sleep 10

        # Store PIDs for cleanup
        echo $BACKEND_PID > backend.pid
        echo $FRONTEND_PID > frontend.pid

    - name: Run E2E tests
      run: |
        BASE_URL=http://localhost:4173 npm run test:e2e

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    - name: Cleanup test servers
      if: always()
      run: |
        if [ -f backend.pid ]; then
          kill $(cat backend.pid) || true
        fi
        if [ -f frontend.pid ]; then
          kill $(cat frontend.pid) || true
        fi

  # Security Scanning
  security-scan:
    name: Security Analysis
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run security audit (npm)
      run: npm audit --audit-level=moderate

    - name: Check for secrets
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: main
        head: HEAD
        extra_args: --debug --only-verified

  # Build Validation
  build-validation:
    name: Production Build Validation
    runs-on: ubuntu-latest
    needs: [frontend-tests, backend-tests]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Production build
      run: npm run build

    - name: Validate build artifacts
      run: |
        if [ ! -d "dist" ]; then
          echo "Build directory not found!"
          exit 1
        fi

        if [ ! -f "dist/index.html" ]; then
          echo "Main HTML file not found!"
          exit 1
        fi

        echo "✅ Production build validation passed"

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: production-build
        path: dist/
        retention-days: 7

  # Overall status check
  ci-status:
    name: CI Status Check
    runs-on: ubuntu-latest
    needs: [frontend-tests, backend-tests, e2e-tests, security-scan, build-validation]
    if: always()

    steps:
    - name: Check CI results
      run: |
        echo "Frontend Tests: ${{ needs.frontend-tests.result }}"
        echo "Backend Tests: ${{ needs.backend-tests.result }}"
        echo "E2E Tests: ${{ needs.e2e-tests.result }}"
        echo "Security Scan: ${{ needs.security-scan.result }}"
        echo "Build Validation: ${{ needs.build-validation.result }}"

        if [[ "${{ needs.frontend-tests.result }}" == "success" &&
              "${{ needs.backend-tests.result }}" == "success" &&
              "${{ needs.e2e-tests.result }}" == "success" &&
              "${{ needs.security-scan.result }}" == "success" &&
              "${{ needs.build-validation.result }}" == "success" ]]; then
          echo "✅ All CI checks passed!"
        else
          echo "❌ Some CI checks failed"
          exit 1
        fi