name: Feature Request
description: Suggest a new feature or enhancement
title: "[FEATURE] "
labels: ["enhancement", "needs-triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a new feature! Please provide as much detail as possible to help us understand your request.

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission Checklist
      description: Please verify the following before submitting
      options:
        - label: I have searched existing issues to ensure this isn't a duplicate
          required: true
        - label: I have checked the project roadmap/documentation
          required: true

  - type: dropdown
    id: category
    attributes:
      label: Feature Category
      description: What type of feature is this?
      options:
        - User Interface (Frontend)
        - API/Backend Functionality
        - Database/Data Management
        - Reports and Analytics
        - Authentication/Security
        - Integration with External Systems
        - Performance/Optimization
        - Developer Experience
        - Documentation
        - Other
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of the system would this affect?
      options:
        - Cases Management
        - Clients Management
        - Hearings Management
        - Reports System
        - User Management
        - Dashboard
        - Search/Filtering
        - File Management
        - Notifications
        - Settings/Configuration
        - Multiple Components
        - New Component
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Feature Summary
      description: Brief description of the feature
      placeholder: "Describe the feature in 1-2 sentences"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve?
      placeholder: "Describe the current problem or limitation that this feature would address"
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Detailed description of your proposed solution
      placeholder: "Describe how you envision this feature working"
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Solutions
      description: Have you considered any alternative approaches?
      placeholder: "Describe any alternative solutions you've considered"

  - type: textarea
    id: user_story
    attributes:
      label: User Story
      description: "Describe this feature from a user's perspective"
      placeholder: |
        As a [type of user]
        I want [some goal/functionality]
        So that [some reason/benefit]
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance Criteria
      description: "What specific criteria must be met for this feature to be considered complete?"
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
        - [ ] Criterion 3

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature?
      options:
        - Critical (Blocking current work, urgent business need)
        - High (Important for next release, significant value)
        - Medium (Would be nice to have, moderate value)
        - Low (Future consideration, minor improvement)
    validations:
      required: true

  - type: dropdown
    id: complexity
    attributes:
      label: Estimated Complexity
      description: How complex do you think this feature would be to implement?
      options:
        - Simple (Few hours, minor changes)
        - Medium (1-3 days, moderate changes)
        - Complex (1-2 weeks, significant changes)
        - Very Complex (Multiple weeks, major architectural changes)
        - Unknown/Need Technical Analysis
    validations:
      required: true

  - type: textarea
    id: mockups
    attributes:
      label: Mockups/Wireframes
      description: If applicable, provide mockups, wireframes, or sketches
      placeholder: "Drag and drop images here or paste links to mockups"

  - type: textarea
    id: technical_considerations
    attributes:
      label: Technical Considerations
      description: Any technical requirements, constraints, or considerations?
      placeholder: |
        - Database changes required
        - API modifications needed
        - Third-party integrations
        - Performance considerations
        - Security requirements

  - type: textarea
    id: business_value
    attributes:
      label: Business Value
      description: What's the expected business impact or benefit?
      placeholder: |
        - Improved user efficiency
        - Reduced manual work
        - Better data accuracy
        - Enhanced reporting capabilities
        - Cost savings

  - type: checkboxes
    id: implementation_areas
    attributes:
      label: Implementation Areas
      description: Which areas would likely need changes? (Check all that apply)
      options:
        - label: Frontend UI/UX changes
        - label: Backend API modifications
        - label: Database schema changes
        - label: Authentication/Authorization changes
        - label: New API endpoints
        - label: Third-party integrations
        - label: Configuration changes
        - label: Documentation updates
        - label: Testing strategy updates

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Any other information that would help understand this request
      placeholder: "Screenshots, links to similar features, research data, etc."