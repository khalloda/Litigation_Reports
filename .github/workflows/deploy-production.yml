name: Deploy to Production

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (e.g., v1.2.3)'
        required: true
      confirm_production:
        description: 'Type "CONFIRM" to deploy to production'
        required: true

env:
  NODE_VERSION: '18'
  PHP_VERSION: '8.2'

jobs:
  pre-deployment-checks:
    name: Pre-deployment Security & Quality Checks
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Validate production deployment
      run: |
        if [[ "${{ github.event.inputs.confirm_production }}" != "CONFIRM" && "${{ github.event_name }}" != "release" ]]; then
          echo "❌ Production deployment not confirmed"
          echo "Manual deployments require 'CONFIRM' in the confirm_production field"
          exit 1
        fi

    - name: Security audit
      run: |
        npm audit --audit-level=high
        echo "✅ Security audit passed"

    - name: Check for sensitive data
      run: |
        # Check for common secrets patterns
        if grep -r "password.*=" . --exclude-dir=node_modules --exclude-dir=.git --exclude="*.yml" | grep -v ".env.example"; then
          echo "❌ Potential hardcoded passwords found"
          exit 1
        fi
        echo "✅ No hardcoded secrets detected"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: pre-deployment-checks
    environment: production

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci --production=false

    - name: Run full test suite
      run: |
        npm run lint
        npm run type-check
        npm run test
        echo "✅ All tests passed"

    - name: Build for production
      run: |
        NODE_ENV=production npm run build
        echo "✅ Production build completed"

    - name: Optimize production build
      run: |
        # Remove development files from dist
        find dist -name "*.map" -delete
        echo "✅ Build optimized for production"

    - name: Create production deployment package
      run: |
        # Create production deployment directory
        mkdir -p production-deploy

        # Copy optimized frontend build
        cp -r dist/* production-deploy/

        # Copy backend (excluding development files)
        cp -r backend production-deploy/
        find production-deploy/backend -name "test*" -delete
        find production-deploy/backend -name "debug*" -delete

        # Copy essential database files
        cp -r database/migrations production-deploy/database/
        cp database/schema.sql production-deploy/database/ 2>/dev/null || true

        # Copy production configuration template
        cp .env.example production-deploy/.env.production

        # Create production deployment manifest
        cat > production-deploy/PRODUCTION_DEPLOYMENT.txt << EOF
        Litigation Management System - Production Deployment
        ===================================================

        Deployment Date: $(date)
        Version: ${{ github.event.inputs.version || github.ref_name }}
        Commit SHA: ${{ github.sha }}
        Build ID: ${{ github.run_id }}

        Production URL: https://lit.sarieldin.com

        Post-deployment checklist:
        [ ] Update .env.production with production secrets
        [ ] Run database migrations
        [ ] Verify SSL certificate
        [ ] Test critical user flows
        [ ] Monitor error logs
        [ ] Verify backup systems
        EOF

        # Create security checklist
        cat > production-deploy/SECURITY_CHECKLIST.txt << EOF
        Production Security Checklist
        ============================

        Before going live:
        [ ] JWT_SECRET is set to a secure random value (32+ characters)
        [ ] Database password is secure and unique
        [ ] HTTPS is enforced
        [ ] Error reporting is configured for production
        [ ] Debug mode is disabled (APP_DEBUG=false)
        [ ] File upload restrictions are in place
        [ ] CORS settings are properly configured
        [ ] Backup systems are operational
        EOF

    - name: Upload production deployment
      uses: actions/upload-artifact@v4
      with:
        name: production-deployment-${{ github.run_id }}
        path: production-deploy/
        retention-days: 90

    - name: Deploy to GoDaddy (Manual Process)
      run: |
        echo "🚀 PRODUCTION DEPLOYMENT READY"
        echo "================================"
        echo ""
        echo "📦 Deployment Package: production-deployment-${{ github.run_id }}"
        echo "🌐 Target: https://lit.sarieldin.com"
        echo "📋 Version: ${{ github.event.inputs.version || github.ref_name }}"
        echo ""
        echo "MANUAL DEPLOYMENT STEPS:"
        echo "========================"
        echo "1. Download the production deployment artifact"
        echo "2. Connect to GoDaddy hosting via cPanel File Manager or FTP"
        echo "3. Backup current production files"
        echo "4. Upload new files to public_html/"
        echo "5. Update .env.production with production secrets"
        echo "6. Run database migrations via phpMyAdmin"
        echo "7. Test the deployment thoroughly"
        echo "8. Monitor logs for any issues"
        echo ""
        echo "⚠️  CRITICAL: Review SECURITY_CHECKLIST.txt before going live"

    - name: Create deployment summary
      if: always()
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          echo "✅ Production deployment package created successfully"
          echo "🔍 Security checks passed"
          echo "📋 Manual deployment steps provided"
        else
          echo "❌ Production deployment failed"
          echo "🚨 DO NOT DEPLOY to production"
        fi

  post-deployment:
    name: Post-deployment Monitoring Setup
    runs-on: ubuntu-latest
    needs: deploy-production
    if: success()

    steps:
    - name: Setup monitoring alerts
      run: |
        echo "🔍 Production Monitoring Checklist"
        echo "================================="
        echo ""
        echo "After successful deployment, monitor:"
        echo "• Application response times"
        echo "• Error rates and logs"
        echo "• Database performance"
        echo "• SSL certificate validity"
        echo "• User authentication flows"
        echo "• File upload functionality"
        echo "• Report generation performance"
        echo ""
        echo "Set up alerts for:"
        echo "• 5xx HTTP errors"
        echo "• High response times (>3s)"
        echo "• Database connection failures"
        echo "• Failed authentication attempts"

    - name: Deployment completion notification
      run: |
        echo "🎉 PRODUCTION DEPLOYMENT WORKFLOW COMPLETED"
        echo "=========================================="
        echo ""
        echo "Next steps:"
        echo "1. Complete manual deployment to GoDaddy"
        echo "2. Verify all systems are operational"
        echo "3. Run post-deployment health checks"
        echo "4. Update team on deployment status"